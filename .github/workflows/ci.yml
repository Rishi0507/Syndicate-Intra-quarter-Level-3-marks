name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ingest:
    name: Ingest (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ingest/go.mod
          cache: false
      - name: Formatting
        run: test -z "$(gofmt -l ingest)" || { gofmt -l ingest; exit 1; }
      - name: Vet
        run: go vet ./...
        working-directory: ingest
      - name: Test
        run: go test ./...
        working-directory: ingest

  kernel:
    name: Kernel (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kernel
      - name: Test
        run: cargo test --lib --manifest-path kernel/Cargo.toml
      - name: Build WebAssembly
        run: |
          cargo build --release --lib --target wasm32-unknown-unknown --manifest-path kernel/Cargo.toml
          ls -l kernel/target/wasm32-unknown-unknown/release/syndicate_kernel.wasm

  web:
    name: Web (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npx vite build

  end-to-end:
    name: Synthetic market, end to end
    needs: [ingest, kernel, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ingest/go.mod
          cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kernel
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Generate, ingest, fit, backtest and export
        run: bash scripts/pipeline.sh synthetic
      - name: Score against the known answer
        run: ./kernel/target/release/syndicate truth data/synth/build
